<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIMI CLAN WAR</title>
<link rel="icon" type="image/png" href="grimi-logo.png">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;font-size:15px;}
.hidden{display:none!important;}
body.guest-mode .admin-only{display:none!important;}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-blue{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;}
.btn-gray{background:#334155;color:#94a3b8;}
.btn-gray:hover{background:#475569;color:#cbd5e1;}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1e293b;}
.btn-sm{padding:7px 16px;font-size:13px;}
.btn-xs{padding:5px 12px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
input,select{padding:8px 12px;border:2px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:15px;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:#3b82f6;}
.card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;}

/* 로그인 */
#loginScreen{max-width:440px;margin:60px auto;text-align:center;padding:20px;}
#loginScreen h1{font-size:42px;font-weight:900;background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;letter-spacing:1px;}
#loginScreen .sub{color:#94a3b8;font-size:15px;margin-bottom:28px;}
.login-box{background:#1e293b;border-radius:16px;padding:28px;border:1px solid #334155;}
.login-box h2{font-size:16px;margin-bottom:16px;color:#cbd5e1;}
/* 커스텀 드롭다운 */
.custom-select-wrap{position:relative;margin-bottom:16px;}
.custom-select-btn{width:100%;padding:14px 18px;background:#0f172a;border:2px solid #334155;border-radius:12px;color:#e2e8f0;font-size:16px;font-weight:700;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s;}
.custom-select-btn:hover{border-color:#3b82f6;}
.custom-select-btn.open{border-color:#3b82f6;border-radius:12px 12px 0 0;}
.custom-select-btn .arrow{font-size:12px;color:#64748b;transition:transform .2s;}
.custom-select-btn.open .arrow{transform:rotate(180deg);}
.custom-select-btn .placeholder{color:#64748b;}
.custom-select-list{display:none;position:absolute;top:100%;left:0;right:0;background:#0f172a;border:2px solid #3b82f6;border-top:1px solid #334155;border-radius:0 0 12px 12px;z-index:50;max-height:220px;overflow-y:auto;}
.custom-select-list.open{display:block;}
.custom-select-item{padding:14px 18px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:background .1s;border-bottom:1px solid #1e293b;}
.custom-select-item:last-child{border-bottom:none;}
.custom-select-item:hover{background:#1e293b;}
.custom-select-item.selected{background:rgba(59,130,246,.15);color:#60a5fa;}
.custom-select-item .cs-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;}
.pin-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.pin-digit{width:50px;height:58px;text-align:center;font-size:26px;font-weight:800;border:2px solid #334155;border-radius:10px;background:#0f172a;color:#fbbf24;outline:none;}
.pin-digit:focus{border-color:#3b82f6;}
.pin-error{color:#ef4444;font-size:13px;margin-bottom:8px;min-height:18px;}
.login-divider{border-top:1px solid #334155;margin:20px 0;position:relative;}
.login-divider span{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#1e293b;padding:0 12px;color:#64748b;font-size:13px;}
.pin-section{display:none;}
.pin-section.show{display:block;}

/* 상단바 */
.top-bar{background:#1e293b;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;flex-wrap:wrap;gap:8px;}
.top-bar h1{font-size:22px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;}
.top-info{display:flex;align-items:center;gap:10px;font-size:14px;color:#94a3b8;}
.badge-admin{background:#ef4444;color:#fff;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;}
.badge-guest{background:#334155;color:#94a3b8;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;}
.online-dot{display:inline-block;width:7px;height:7px;background:#10b981;border-radius:50%;margin-right:3px;}
.online-info{font-size:12px;color:#94a3b8;}
.event-status{text-align:center;padding:10px;font-size:15px;font-weight:600;}
.event-live{background:#10b981;color:#fff;}.event-idle{background:#334155;color:#64748b;}
.tabs{display:flex;background:#1e293b;border-bottom:1px solid #334155;overflow-x:auto;position:sticky;top:0;z-index:20;}
.tab{padding:14px 20px;font-size:15px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab:hover{color:#94a3b8;}
.tab.active{color:#60a5fa;border-bottom-color:#3b82f6;}
.main{padding:20px;max-width:1400px;margin:0 auto;}

/* TOP 3 포디움 */
.podium{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.podium-card{background:#1e293b;border-radius:14px;padding:14px 20px;border:2px solid #334155;text-align:center;min-width:140px;flex:0 1 200px;transition:all .2s;}
.podium-card.p1{border-color:#fbbf24;box-shadow:0 0 24px rgba(251,191,36,.12);order:2;}
.podium-card.p2{border-color:#c0c0c0;order:1;}
.podium-card.p3{border-color:#cd7f32;order:3;}
.podium-medal{font-size:28px;margin-bottom:2px;}
.podium-rank{font-size:12px;font-weight:800;color:#64748b;margin-bottom:4px;}
.podium-team{font-size:16px;font-weight:900;margin-bottom:2px;}
.podium-score{font-size:22px;font-weight:900;color:#fbbf24;}
.podium-clan{margin-top:4px;}

/* 순위 보드 */
.board-section{margin-bottom:24px;}
.board-title{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.board-title .live-dot{width:8px;height:8px;background:#10b981;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.score-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #334155;}
.score-table{width:100%;border-collapse:collapse;font-size:15px;min-width:600px;}
.score-table th{background:#334155;padding:12px 10px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;white-space:nowrap;position:sticky;top:0;z-index:1;}
.score-table td{padding:12px 10px;text-align:center;border-bottom:1px solid #0f172a;white-space:nowrap;font-size:15px;}
.score-table tbody tr:hover td{background:rgba(51,65,85,.4);}
.score-table .col-rank{font-size:22px;font-weight:900;width:46px;}
.score-table .col-team{text-align:left;font-weight:700;font-size:16px;}
.score-table .col-kill{color:#fbbf24;font-weight:700;}
.score-table .col-place{color:#60a5fa;font-weight:600;}
.score-table .col-total{font-weight:900;font-size:18px;color:#fbbf24;}
.score-table .row-gold td{background:rgba(251,191,36,.06);}
.score-table .row-silver td{background:rgba(192,192,192,.04);}
.score-table .row-bronze td{background:rgba(205,127,50,.04);}
.rank-1{color:#fbbf24;}.rank-2{color:#c0c0c0;}.rank-3{color:#cd7f32;}.rank-else{color:#475569;}
.clan-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff;}
.round-header{font-size:11px;color:#64748b;display:block;font-weight:400;}
.placement-num{font-size:11px;color:#94a3b8;display:block;margin-top:1px;}

/* 라운드별 순위 */
.round-rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:20px;}
.round-rank-card{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow:hidden;}
.round-rank-head{padding:12px 16px;background:#334155;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;}
.round-rank-head .rr-round{color:#60a5fa;}
.round-rank-head .rr-map{color:#94a3b8;font-weight:600;font-size:13px;}
.rr-table{width:100%;border-collapse:collapse;font-size:14px;}
.rr-table td{padding:8px 12px;border-bottom:1px solid #0f172a;}
.rr-table .rr-rank{font-weight:900;width:32px;text-align:center;font-size:16px;}
.rr-table .rr-team{font-weight:700;text-align:left;}
.rr-table .rr-kill{color:#fbbf24;font-weight:700;text-align:center;width:50px;}
.rr-table .rr-pts{color:#60a5fa;font-weight:700;text-align:center;width:50px;}
.rr-table .rr-total{font-weight:900;color:#fbbf24;text-align:center;width:55px;font-size:15px;}
.rr-table tr:first-child td{background:rgba(251,191,36,.06);}
.rr-table tr:nth-child(2) td{background:rgba(192,192,192,.03);}
.rr-table tr:nth-child(3) td{background:rgba(205,127,50,.03);}

/* 점수 입력 */
.round-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.round-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:#0f172a;color:#64748b;border:1px solid #334155;transition:all .15s;}
.round-tab:hover{border-color:#60a5fa;color:#94a3b8;}
.round-tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6;}
.input-table{width:100%;border-collapse:collapse;font-size:15px;}
.input-table th{background:#334155;padding:12px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;}
.input-table td{padding:10px;text-align:center;border-bottom:1px solid #0f172a;}
.input-table .team-name-cell{text-align:left;font-weight:700;font-size:15px;}
.input-table select,.input-table input[type=number]{width:70px;padding:7px 4px;font-size:15px;text-align:center;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;}
.input-table input[type=number]:focus,.input-table select:focus{border-color:#3b82f6;outline:none;}
.auto-pts{font-size:14px;color:#60a5fa;font-weight:700;}

/* 설정 */
.setup-card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;margin-bottom:16px;}
.setup-card h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.setup-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.setup-row label{font-size:14px;color:#94a3b8;min-width:60px;}
.item-list{display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f172a;border-radius:8px;border:1px solid #334155;}
.item-row .item-name{flex:1;font-weight:600;font-size:14px;}
.item-delete{background:none;border:none;color:#475569;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;}
.item-delete:hover{background:#ef4444;color:#fff;}
.color-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.clan-logo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #475569;}
.clan-logo-sm{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;border:1px solid #475569;}
.clan-logo-lg{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #475569;margin-bottom:6px;}
.logo-upload-btn{padding:6px 12px;background:#334155;border:1px dashed #475569;border-radius:8px;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-block;}
.logo-upload-btn:hover{background:#475569;color:#e2e8f0;border-color:#60a5fa;}
.logo-preview{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #475569;}
.pts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;}
.pts-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0f172a;border-radius:6px;border:1px solid #334155;font-size:13px;}
.pts-item label{color:#94a3b8;white-space:nowrap;min-width:30px;}
.pts-item input{width:44px;padding:4px;font-size:13px;text-align:center;border:1px solid #334155;border-radius:4px;background:#1e293b;color:#fbbf24;font-weight:700;}

/* 토스트 */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* 모달 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#1e293b;border-radius:16px;padding:28px;border:1px solid #334155;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;padding:4px;}
.modal-close:hover{color:#e2e8f0;}

@media(max-width:600px){
  .top-bar{padding:10px 14px;}
  .main{padding:14px;}
  .podium{gap:8px;}
  .podium-card{min-width:100px;padding:10px 12px;}
  .podium-team{font-size:14px;}
  .podium-score{font-size:18px;}
  .score-table{min-width:500px;}
  .pts-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <img src="grimi-logo.png" alt="GRIMI" style="width:100px;height:100px;border-radius:50%;margin-bottom:12px;object-fit:cover;" onerror="this.style.display='none'">
  <h1>CLAN WAR</h1>
  <p class="sub">클랜 교류전 스코어보드</p>
  <div class="login-box">
    <h2>관리자 로그인</h2>
    <div class="custom-select-wrap" id="adminSelectWrap">
      <div class="custom-select-btn" id="adminSelectBtn" onclick="toggleAdminDropdown()">
        <span class="placeholder">관리자를 선택하세요</span>
        <span class="arrow">▼</span>
      </div>
      <div class="custom-select-list" id="adminSelectList"></div>
    </div>
    <div id="pinSection" class="pin-section">
      <p style="font-size:14px;color:#cbd5e1;margin-bottom:10px;text-align:center;"><strong id="selectedAdminName" style="color:#fbbf24;font-size:16px;"></strong>님, PIN을 입력하세요</p>
      <div class="pin-inputs" id="pinInputs">
        <input class="pin-digit" type="password" maxlength="1" inputmode="numeric">
        <input class="pin-digit" type="password" maxlength="1" inputmode="numeric">
        <input class="pin-digit" type="password" maxlength="1" inputmode="numeric">
        <input class="pin-digit" type="password" maxlength="1" inputmode="numeric">
      </div>
      <div class="pin-error" id="pinError"></div>
    </div>
    <div class="login-divider"><span>또는</span></div>
    <button class="btn btn-gray" onclick="enterAsGuest()" style="width:100%;">조회 모드로 입장</button>
  </div>
</div>

<!-- 메인 -->
<div id="appScreen" class="hidden">
  <div class="top-bar">
    <h1 onclick="switchTab('board')">CLAN WAR</h1>
    <div class="top-info">
      <span id="titleDisplay" style="font-weight:700;color:#cbd5e1;"></span>
      <span id="roleBadge"></span>
      <span class="online-info"><span class="online-dot"></span><span id="onlineCount">0</span>명 접속</span>
      <button class="btn btn-xs btn-gray" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div id="statusBar" class="event-status event-idle">대회 대기 중</div>
  <div class="tabs">
    <div class="tab active" data-tab="board" onclick="switchTab('board')">순위 보드</div>
    <div class="tab admin-only" data-tab="input" onclick="switchTab('input')">점수 입력</div>
    <div class="tab admin-only" data-tab="setup" onclick="switchTab('setup')">대회 설정</div>
  </div>
  <div class="main">
    <!-- 순위 보드 -->
    <div id="tab-board">
      <div id="podiumArea" class="podium"></div>
      <div class="board-section">
        <div class="board-title"><span class="live-dot"></span> 실시간 팀 순위</div>
        <div id="teamBoardArea"><div class="card" style="text-align:center;color:#64748b;padding:40px;">아직 등록된 팀이 없습니다.</div></div>
      </div>
      <div id="roundRankArea"></div>
      <div id="onlineListArea" style="margin-top:8px;"></div>
    </div>
    <!-- 점수 입력 -->
    <div id="tab-input" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:14px;font-size:17px;">라운드별 점수 입력</h3>
        <div id="roundTabsArea" class="round-tabs"></div>
        <div id="scoreInputArea"><p style="color:#64748b;font-size:14px;">라운드를 먼저 추가해주세요.</p></div>
      </div>
    </div>
    <!-- 대회 설정 -->
    <div id="tab-setup" class="hidden">
      <div class="setup-card"><h3>대회 정보</h3>
        <div class="setup-row"><label>대회명</label><input type="text" id="eventTitle" placeholder="예: 제1회 클랜 교류전" style="flex:1;max-width:300px;" onchange="saveConfig()"></div>
        <div class="setup-row" style="gap:12px;">
          <button class="btn btn-sm btn-green" onclick="setEventStatus('live')">대회 시작</button>
          <button class="btn btn-sm btn-amber" onclick="setEventStatus('idle')">대기 상태</button>
          <button class="btn btn-sm btn-red" onclick="resetAll()">전체 초기화</button>
        </div>
      </div>
      <div class="setup-card"><h3>관리자 관리</h3>
        <div class="setup-row">
          <input type="text" id="newAdminName" placeholder="관리자 이름" style="width:140px;">
          <button class="btn btn-sm btn-blue" onclick="addAdmin()">추가</button>
        </div>
        <div id="adminListArea" class="item-list"></div>
        <div class="setup-row" style="margin-top:12px;">
          <label>공용 PIN</label>
          <input type="text" id="pinDisplay" readonly style="width:80px;text-align:center;font-weight:800;color:#fbbf24;font-size:18px;letter-spacing:4px;" value="••••">
          <button class="btn btn-xs btn-gray" onclick="togglePinVisible()">보기</button>
          <input type="password" id="newPinInput" placeholder="새 PIN (4자리)" maxlength="4" style="width:100px;font-size:14px;">
          <button class="btn btn-sm btn-gray" onclick="changePin()">PIN 변경</button>
        </div>
      </div>
      <div class="setup-card"><h3>클랜 관리</h3>
        <div class="setup-row">
          <input type="text" id="newClanId" placeholder="약칭 (예: GRM)" style="width:100px;">
          <input type="text" id="newClanName" placeholder="클랜명 (예: 그리미)" style="width:140px;">
          <input type="color" id="newClanColor" value="#3b82f6" style="width:40px;height:36px;padding:2px;border-radius:6px;cursor:pointer;">
          <label class="logo-upload-btn" id="logoUploadLabel"><span id="logoUploadText">마크 업로드</span><input type="file" id="newClanLogo" accept="image/*" style="display:none;" onchange="previewLogo(this)"></label>
          <img id="logoPreview" class="logo-preview" style="display:none;">
          <button class="btn btn-sm btn-blue" onclick="addClan()">추가</button>
        </div>
        <div id="clanListArea" class="item-list"></div>
      </div>
      <div class="setup-card"><h3>팀 관리</h3>
        <div class="setup-row">
          <input type="text" id="newTeamName" placeholder="팀명 (예: GRM-1)" style="width:140px;">
          <select id="newTeamClan" style="width:120px;"><option value="">클랜 선택</option></select>
          <button class="btn btn-sm btn-blue" onclick="addTeam()">추가</button>
        </div>
        <div id="teamListArea" class="item-list"></div>
      </div>
      <div class="setup-card"><h3>라운드 관리</h3>
        <div class="setup-row">
          <select id="newRoundMap" style="width:120px;">
            <option>에란겔</option><option>미라마</option><option>사녹</option><option>테이고</option><option>비켄디</option><option>파라모</option><option>카라킨</option><option>론도</option><option>데스턴</option>
          </select>
          <button class="btn btn-sm btn-green" onclick="addRound()">+ 라운드 추가</button>
        </div>
        <div id="roundListArea" class="item-list"></div>
      </div>
      <div class="setup-card"><h3>순위 점수표</h3>
        <p style="font-size:13px;color:#64748b;margin-bottom:10px;">각 등수에 부여할 점수 (킬 점수는 1킬 = 1점 고정)</p>
        <div id="rankPtsArea" class="pts-grid"></div>
        <button class="btn btn-sm btn-blue" onclick="saveRankPts()" style="margin-top:12px;">점수표 저장</button>
      </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<div id="confirmModal" class="modal-overlay hidden" onclick="if(event.target===this)closeConfirm()">
  <div class="modal-box">
    <div class="modal-title"><span id="confirmTitle">확인</span><button class="modal-close" onclick="closeConfirm()">✕</button></div>
    <p id="confirmMsg" style="margin-bottom:18px;color:#94a3b8;font-size:15px;"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-sm btn-gray" onclick="closeConfirm()">취소</button>
      <button class="btn btn-sm btn-red" id="confirmBtn">확인</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyABoG4B0ahW0OAZURa3WZAz9HDST49A2K4",authDomain:"grimi-pubg.firebaseapp.com",databaseURL:"https://grimi-pubg-default-rtdb.firebaseio.com",projectId:"grimi-pubg",storageBucket:"grimi-pubg.firebasestorage.app",messagingSenderId:"507556279092",appId:"1:507556279092:web:71182597db9c8c8a71ab61"});
const db=firebase.database(),ROOT='clanwar',ref=db.ref(ROOT);

let isAdmin=false,currentAdminName='',appData={},presenceKey=null;
const DEFAULT_RANK_PTS={1:10,2:6,3:5,4:4,5:3,6:2,7:1,8:0,9:0,10:0,11:0,12:0,13:0,14:0,15:0,16:0,17:0,18:0,19:0,20:0};
let activeInputRound=null,selectedAdminId=null;

function init(){
  ref.on('value',snap=>{
    appData=snap.val()||{};
    ['config','admins','clans','teams','rounds','scores'].forEach(k=>{if(!appData[k])appData[k]={};});
    if(!appData.rankPts) appData.rankPts=DEFAULT_RANK_PTS;
    if(!appData.presence) appData.presence={};
    renderLoginAdmins();
    if(!document.getElementById('appScreen').classList.contains('hidden')) renderAll();
  });
  ref.child('presence').on('value',snap=>{appData.presence=snap.val()||{};updateOnlineDisplay();});
  // Close dropdown on outside click
  document.addEventListener('click',e=>{
    if(!e.target.closest('#adminSelectWrap')){
      document.getElementById('adminSelectBtn').classList.remove('open');
      document.getElementById('adminSelectList').classList.remove('open');
    }
  });
}

// ===== Presence =====
function joinPresence(name,role){
  const pRef=ref.child('presence').push();
  presenceKey=pRef.key;
  pRef.set({name,role,joinedAt:Date.now()});
  pRef.onDisconnect().remove();
}
function leavePresence(){if(presenceKey){ref.child('presence/'+presenceKey).remove();presenceKey=null;}}
function updateOnlineDisplay(){
  const entries=Object.values(appData.presence||{});
  const el=document.getElementById('onlineCount');
  if(el) el.textContent=entries.length;
  const listArea=document.getElementById('onlineListArea');
  if(!listArea) return;
  if(!entries.length){listArea.innerHTML='';return;}
  const admins=entries.filter(e=>e.role==='admin');
  const guests=entries.filter(e=>e.role==='guest');
  let html='<div style="font-size:13px;color:#64748b;display:flex;flex-wrap:wrap;gap:6px;align-items:center;"><span style="font-weight:700;">접속 중:</span> ';
  admins.forEach(a=>{html+=`<span style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;">${a.name}</span>`;});
  if(guests.length) html+=`<span style="background:#334155;padding:2px 8px;border-radius:6px;font-size:12px;">게스트 ${guests.length}명</span>`;
  html+='</div>';
  listArea.innerHTML=html;
}

// ===== Login (Custom Dropdown) =====
function renderLoginAdmins(){
  const admins=appData.admins||{};
  const ids=Object.keys(admins);
  const list=document.getElementById('adminSelectList');
  if(!ids.length){
    list.innerHTML='<div class="custom-select-item" onclick="pickAdmin(\'__master__\',\'최초 설정\')"><span class="cs-dot"></span> 최초 설정 (관리자 등록)</div>';
    return;
  }
  list.innerHTML=ids.map(id=>{
    const a=admins[id];
    return `<div class="custom-select-item" onclick="pickAdmin('${id}','${a.name}')">${a.name}</div>`;
  }).join('');
}
function toggleAdminDropdown(){
  document.getElementById('adminSelectBtn').classList.toggle('open');
  document.getElementById('adminSelectList').classList.toggle('open');
}
function pickAdmin(id,name){
  selectedAdminId=id;
  const btn=document.getElementById('adminSelectBtn');
  btn.innerHTML=`<span style="color:#e2e8f0;font-weight:700;">${name}</span><span class="arrow">▼</span>`;
  btn.classList.remove('open');
  document.getElementById('adminSelectList').classList.remove('open');
  document.getElementById('selectedAdminName').textContent=name;
  document.getElementById('pinSection').classList.add('show');
  setupPinInputs();
}
function setupPinInputs(){
  const inps=document.querySelectorAll('#pinInputs .pin-digit');
  inps.forEach((inp,i)=>{
    inp.value='';
    const n=inp.cloneNode(true);
    inp.parentNode.replaceChild(n,inp);
  });
  const f=document.querySelectorAll('#pinInputs .pin-digit');
  f.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{
      if(inp.value.length===1&&i<f.length-1) f[i+1].focus();
      if(i===f.length-1&&inp.value) setTimeout(tryLogin,80);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0){f[i-1].focus();f[i-1].value='';}});
  });
  setTimeout(()=>f[0]?.focus(),100);
}
function getPinValue(){return Array.from(document.querySelectorAll('#pinInputs .pin-digit')).map(i=>i.value).join('');}
function tryLogin(){
  const pin=getPinValue();if(pin.length<4) return;
  if(pin===(appData.config?.adminPin||'0000')){
    isAdmin=true;
    currentAdminName=selectedAdminId==='__master__'?'마스터':(appData.admins?.[selectedAdminId]?.name||'관리자');
    enterApp();
  } else {
    document.getElementById('pinError').textContent='PIN이 올바르지 않습니다';
    document.querySelectorAll('#pinInputs .pin-digit').forEach(i=>i.value='');
    document.querySelector('#pinInputs .pin-digit')?.focus();
  }
}
function enterAsGuest(){isAdmin=false;currentAdminName='';enterApp();}
function enterApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  if(!isAdmin) document.body.classList.add('guest-mode');
  else document.body.classList.remove('guest-mode');
  document.getElementById('roleBadge').innerHTML=isAdmin?`<span class="badge-admin">${currentAdminName}</span>`:'<span class="badge-guest">조회 모드</span>';
  joinPresence(isAdmin?currentAdminName:'게스트',isAdmin?'admin':'guest');
  renderAll();
}
function logout(){
  leavePresence();
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  document.body.classList.remove('guest-mode');
  isAdmin=false;currentAdminName='';selectedAdminId=null;
  document.getElementById('pinSection').classList.remove('show');
  document.getElementById('pinError').textContent='';
  // Reset dropdown
  document.getElementById('adminSelectBtn').innerHTML='<span class="placeholder">관리자를 선택하세요</span><span class="arrow">▼</span>';
  renderLoginAdmins();
  switchTab('board');
}

// ===== Tabs =====
function switchTab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  ['board','input','setup'].forEach(id=>{const el=document.getElementById('tab-'+id);if(el) el.classList.toggle('hidden',id!==t);});
  if(t==='input') renderScoreInput();
}

// ===== Render All =====
function renderAll(){
  const status=appData.config?.status||'idle';
  const bar=document.getElementById('statusBar');
  bar.className='event-status '+(status==='live'?'event-live':'event-idle');
  bar.textContent=status==='live'?(appData.config?.title||'대회 진행 중'):'대회 대기 중';
  document.getElementById('titleDisplay').textContent=appData.config?.title||'';
  renderPodium();
  renderTeamBoard();
  renderRoundRanks();
  updateOnlineDisplay();
  if(isAdmin){renderSetup();renderScoreInput();}
}

// ===== Helpers =====
function getRankPts(p){return Number((appData.rankPts||DEFAULT_RANK_PTS)[p])||0;}
function getClanColor(id){return appData.clans?.[id]?.color||'#64748b';}
function getClanName(id){return appData.clans?.[id]?.name||id;}
function getClanLogo(id){return appData.clans?.[id]?.logo||'';}
function clanTagHtml(id){
  const logo=getClanLogo(id);
  const tag=`<span class="clan-tag" style="background:${getClanColor(id)};margin-right:6px;">${id}</span>`;
  return logo?`<img src="${logo}" class="clan-logo-sm" alt="${id}">${tag}`:tag;
}
let pendingLogoBase64='';
function previewLogo(input){
  const file=input.files[0];
  if(!file){pendingLogoBase64='';document.getElementById('logoPreview').style.display='none';document.getElementById('logoUploadText').textContent='마크 업로드';return;}
  resizeImage(file,128,function(b64){pendingLogoBase64=b64;const p=document.getElementById('logoPreview');p.src=b64;p.style.display='block';document.getElementById('logoUploadText').textContent='변경';});
}
function resizeImage(file,maxSize,cb){
  const r=new FileReader();
  r.onload=function(e){const img=new Image();img.onload=function(){const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>maxSize){h=h*(maxSize/w);w=maxSize;}}else{if(h>maxSize){w=w*(maxSize/h);h=maxSize;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/webp',0.8));};img.src=e.target.result;};
  r.readAsDataURL(file);
}

function getTeamScores(){
  const teams=appData.teams||{},rounds=appData.rounds||{},scores=appData.scores||{};
  const roundIds=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0));
  const result=[];
  Object.keys(teams).forEach(tid=>{
    const t=teams[tid];let totalKills=0,totalPlacePts=0;const roundData={};
    roundIds.forEach(rid=>{
      const s=scores[tid]?.[rid];
      const kills=s?Number(s.kills)||0:0;
      const placement=s?Number(s.placement)||0:0;
      const placePts=placement>0?getRankPts(placement):0;
      roundData[rid]={kills,placement,placePts};
      totalKills+=kills;totalPlacePts+=placePts;
    });
    result.push({id:tid,name:t.name,clan:t.clan,roundData,totalKills,totalPlacePts,total:totalKills+totalPlacePts});
  });
  result.sort((a,b)=>b.total-a.total||(b.totalKills-a.totalKills));
  return {scores:result,roundIds};
}

// ===== Podium (TOP 3) =====
function renderPodium(){
  const {scores}=getTeamScores();
  const area=document.getElementById('podiumArea');
  if(scores.length<1){area.innerHTML='';return;}
  const top3=scores.slice(0,3);
  const medals=['🥇','🥈','🥉'];
  const classes=['p1','p2','p3'];
  area.innerHTML=top3.map((s,i)=>{
    const logo=getClanLogo(s.clan)?`<img src="${getClanLogo(s.clan)}" class="clan-logo-sm" style="width:22px;height:22px;">`:'';
    return `<div class="podium-card ${classes[i]}"><div class="podium-medal">${medals[i]}</div><div class="podium-rank">${i+1}등</div><div class="podium-team">${s.name}</div><div class="podium-clan">${logo}<span class="clan-tag" style="background:${getClanColor(s.clan)};font-size:11px;">${s.clan}</span></div><div class="podium-score">${s.total}</div></div>`;
  }).join('');
}

// ===== Team Board =====
function renderTeamBoard(){
  const {scores,roundIds}=getTeamScores();
  const rounds=appData.rounds||{};
  const area=document.getElementById('teamBoardArea');
  if(!scores.length){area.innerHTML='<div class="card" style="text-align:center;color:#64748b;padding:40px;">아직 등록된 팀이 없습니다.</div>';return;}
  let rh='';
  roundIds.forEach((rid,i)=>{const r=rounds[rid];rh+=`<th><span class="round-header">R${i+1} ${r?.map||''}</span>킬</th><th><span class="round-header">R${i+1}</span>순위점</th>`;});
  let rows='';
  scores.forEach((s,i)=>{
    const rank=i+1;
    const rc=rank<=3?'rank-'+rank:'rank-else';
    const rowc=rank===1?'row-gold':rank===2?'row-silver':rank===3?'row-bronze':'';
    let cells='';
    roundIds.forEach(rid=>{
      const rd=s.roundData[rid];
      const placeLabel=rd.placement>0?`<span class="placement-num">${rd.placement}등</span>`:'';
      cells+=`<td class="col-kill">${rd.kills||'-'}</td><td class="col-place">${rd.placePts?'+'+rd.placePts:'-'}${placeLabel}</td>`;
    });
    rows+=`<tr class="${rowc}"><td class="col-rank ${rc}">${rank}</td><td class="col-team">${clanTagHtml(s.clan)}${s.name}</td>${cells}<td class="col-kill">${s.totalKills}</td><td class="col-place">${s.totalPlacePts}</td><td class="col-total">${s.total}</td></tr>`;
  });
  area.innerHTML=`<div class="score-table-wrap"><table class="score-table"><thead><tr><th>#</th><th style="text-align:left;">팀</th>${rh}<th>총킬</th><th>순위점</th><th>합계</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ===== Round-by-Round Rankings =====
function renderRoundRanks(){
  const {scores,roundIds}=getTeamScores();
  const rounds=appData.rounds||{};
  const area=document.getElementById('roundRankArea');
  if(!roundIds.length||!scores.length){area.innerHTML='';return;}
  let cards='';
  roundIds.forEach((rid,i)=>{
    const r=rounds[rid];
    const ranked=scores.map(s=>{
      const rd=s.roundData[rid];
      const kills=rd?rd.kills:0;
      const placePts=rd?rd.placePts:0;
      const roundTotal=kills+placePts;
      return {name:s.name,clan:s.clan,kills,placePts,roundTotal};
    }).filter(x=>x.roundTotal>0).sort((a,b)=>b.roundTotal-a.roundTotal||(b.kills-a.kills));
    if(!ranked.length) return;
    let rows='';
    ranked.forEach((t,j)=>{
      const rank=j+1;
      const cls=rank===1?'rr-gold':rank===2?'rr-silver':rank===3?'rr-bronze':'';
      rows+=`<tr class="${cls}"><td class="rr-rank">${rank}</td><td class="rr-team">${clanTagHtml(t.clan)}${t.name}</td><td class="rr-kill">${t.kills}</td><td class="rr-pts">+${t.placePts}</td><td class="rr-total">${t.roundTotal}</td></tr>`;
    });
    cards+=`<div class="round-rank-card"><div class="round-rank-head"><span style="color:#fbbf24;">R${i+1}</span>${r?.map||'맵 미정'}</div><table class="rr-table"><thead><tr><th>#</th><th style="text-align:left;">팀</th><th>킬</th><th>순위점</th><th>합계</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  area.innerHTML=cards?`<h3 style="color:#94a3b8;font-size:15px;margin:24px 0 10px;font-weight:700;">라운드별 순위</h3><div class="round-rank-grid">${cards}</div>`:'';
}

// ===== Score Input =====
function renderScoreInput(){
  if(!isAdmin) return;
  const rounds=appData.rounds||{};
  const roundIds=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0));
  const tabsArea=document.getElementById('roundTabsArea');
  const inputArea=document.getElementById('scoreInputArea');
  if(!roundIds.length){tabsArea.innerHTML='';inputArea.innerHTML='<p style="color:#64748b;font-size:14px;">라운드를 먼저 추가해주세요.</p>';return;}
  if(!activeInputRound||!rounds[activeInputRound]) activeInputRound=roundIds[0];
  tabsArea.innerHTML=roundIds.map((rid,i)=>`<div class="round-tab ${rid===activeInputRound?'active':''}" onclick="activeInputRound='${rid}';renderScoreInput()">R${i+1} ${rounds[rid].map||''}</div>`).join('');
  const teams=appData.teams||{};
  const teamIds=Object.keys(teams).sort((a,b)=>(teams[a].name||'').localeCompare(teams[b].name||''));
  if(!teamIds.length){inputArea.innerHTML='<p style="color:#64748b;font-size:14px;">팀을 먼저 등록해주세요.</p>';return;}
  const totalTeams=teamIds.length;
  let rows='';
  teamIds.forEach(tid=>{
    const t=teams[tid];
    const s=appData.scores?.[tid]?.[activeInputRound];
    const kills=s?Number(s.kills)||0:0;
    const placement=s?Number(s.placement)||0:0;
    const placePts=placement>0?getRankPts(placement):0;
    let opts='<option value="0">-</option>';
    for(let p=1;p<=totalTeams;p++) opts+=`<option value="${p}" ${placement===p?'selected':''}>${p}등</option>`;
    rows+=`<tr><td class="team-name-cell">${clanTagHtml(t.clan)}${t.name}</td><td><select onchange="saveScore('${tid}','${activeInputRound}','placement',this.value)">${opts}</select></td><td class="auto-pts">${placement>0?'+'+placePts:'-'}</td><td><input type="number" min="0" max="99" value="${kills||''}" placeholder="0" onfocus="this.select()" onchange="saveScore('${tid}','${activeInputRound}','kills',this.value)"></td><td style="font-weight:800;color:#fbbf24;font-size:16px;">${kills+placePts}</td></tr>`;
  });
  inputArea.innerHTML=`<div style="overflow-x:auto;"><table class="input-table"><thead><tr><th style="text-align:left;">팀</th><th>순위</th><th>순위점</th><th>킬</th><th>합계</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function saveScore(tid,rid,field,val){ref.child('scores/'+tid+'/'+rid+'/'+field).set(Number(val)||0);}

// ===== Setup =====
function renderSetup(){
  if(!isAdmin) return;
  document.getElementById('eventTitle').value=appData.config?.title||'';
  document.getElementById('pinDisplay').value='••••';
  renderAdminList();renderClanList();renderTeamList();renderRoundList();renderRankPtsGrid();updateTeamClanSelect();
}
function saveConfig(){ref.child('config/title').set(document.getElementById('eventTitle').value||'');toast('저장됨');}
function setEventStatus(s){ref.child('config/status').set(s);toast(s==='live'?'대회 시작!':'대기 상태로 변경');}
function resetAll(){showConfirm('전체 초기화','모든 점수와 라운드가 삭제됩니다.',()=>{ref.child('scores').remove();ref.child('rounds').remove();ref.child('config/status').set('idle');toast('초기화 완료');});}

// Admins
function addAdmin(){
  const name=document.getElementById('newAdminName').value.trim();
  if(!name){toast('이름을 입력하세요');return;}
  ref.child('admins/'+ref.child('admins').push().key).set({name});
  document.getElementById('newAdminName').value='';toast(name+' 관리자 추가');
}
function removeAdmin(id){const a=appData.admins?.[id];showConfirm('관리자 삭제',`${a?.name||''} 삭제?`,()=>{ref.child('admins/'+id).remove();toast('삭제됨');});}
function renderAdminList(){
  const admins=appData.admins||{},area=document.getElementById('adminListArea'),ids=Object.keys(admins);
  if(!ids.length){area.innerHTML='<p style="color:#64748b;font-size:13px;">등록된 관리자가 없습니다.</p>';return;}
  const onlineNames=new Set(Object.values(appData.presence||{}).filter(p=>p.role==='admin').map(p=>p.name));
  area.innerHTML=ids.map(id=>{const a=admins[id];const on=onlineNames.has(a.name);
    return `<div class="item-row"><span class="item-name">${on?'<span class="online-dot"></span>':''}${a.name} ${on?'<span style="font-size:11px;color:#10b981;">(접속중)</span>':''}</span><button class="item-delete" onclick="removeAdmin('${id}')">✕</button></div>`;
  }).join('');
}
function changePin(){
  const v=document.getElementById('newPinInput').value.trim();
  if(v.length!==4||!/^\d+$/.test(v)){toast('4자리 숫자를 입력하세요');return;}
  ref.child('config/adminPin').set(v);document.getElementById('newPinInput').value='';document.getElementById('pinDisplay').value='••••';toast('PIN 변경됨');
}
function togglePinVisible(){const el=document.getElementById('pinDisplay');el.value=el.value==='••••'?(appData.config?.adminPin||'0000'):'••••';}

// Clans
function resetClanForm(){
  document.getElementById('newClanId').value='';document.getElementById('newClanName').value='';
  document.getElementById('newClanLogo').value='';document.getElementById('logoPreview').style.display='none';
  document.getElementById('logoUploadText').textContent='마크 업로드';pendingLogoBase64='';
}
function addClan(){
  const id=document.getElementById('newClanId').value.trim().toUpperCase();
  const name=document.getElementById('newClanName').value.trim();
  const color=document.getElementById('newClanColor').value;
  if(!id){toast('클랜 약칭을 입력하세요');return;}
  const data={name:name||id,color};
  if(pendingLogoBase64) data.logo=pendingLogoBase64;
  ref.child('clans/'+id).set(data);resetClanForm();toast(id+' 클랜 추가');
}
function updateClanLogo(cid,input){const file=input.files[0];if(!file)return;resizeImage(file,128,b64=>{ref.child('clans/'+cid+'/logo').set(b64);toast(cid+' 마크 업데이트');});}
function removeClan(id){showConfirm('클랜 삭제',`${id} 클랜 삭제?`,()=>{ref.child('clans/'+id).remove();toast('삭제됨');});}
function renderClanList(){
  const clans=appData.clans||{},area=document.getElementById('clanListArea'),ids=Object.keys(clans).sort();
  if(!ids.length){area.innerHTML='<p style="color:#64748b;font-size:13px;">등록된 클랜이 없습니다.</p>';return;}
  area.innerHTML=ids.map(id=>{const c=clans[id];
    const logo=c.logo?`<img src="${c.logo}" class="clan-logo">`:`<span class="color-dot" style="background:${c.color}"></span>`;
    return `<div class="item-row">${logo}<span class="item-name">${id} <span style="color:#94a3b8;font-size:13px;">(${c.name})</span></span><label class="logo-upload-btn" style="font-size:11px;padding:4px 8px;">${c.logo?'마크 변경':'마크 추가'}<input type="file" accept="image/*" style="display:none;" onchange="updateClanLogo('${id}',this)"></label><button class="item-delete" onclick="removeClan('${id}')">✕</button></div>`;
  }).join('');
}
function updateTeamClanSelect(){
  const sel=document.getElementById('newTeamClan'),clans=appData.clans||{};
  sel.innerHTML='<option value="">클랜 선택</option>'+Object.keys(clans).sort().map(id=>`<option value="${id}">${id} (${clans[id].name})</option>`).join('');
}

// Teams
function addTeam(){
  const name=document.getElementById('newTeamName').value.trim(),clan=document.getElementById('newTeamClan').value;
  if(!name){toast('팀명을 입력하세요');return;}
  if(!clan){toast('클랜을 선택하세요');return;}
  ref.child('teams/'+ref.child('teams').push().key).set({name,clan});
  document.getElementById('newTeamName').value='';toast(name+' 팀 추가');
}
function removeTeam(id){const t=appData.teams?.[id];showConfirm('팀 삭제',`${t?.name||''} 삭제?`,()=>{ref.child('teams/'+id).remove();ref.child('scores/'+id).remove();toast('삭제됨');});}
function renderTeamList(){
  const teams=appData.teams||{},area=document.getElementById('teamListArea');
  const ids=Object.keys(teams).sort((a,b)=>(teams[a].name||'').localeCompare(teams[b].name||''));
  if(!ids.length){area.innerHTML='<p style="color:#64748b;font-size:13px;">등록된 팀이 없습니다.</p>';return;}
  area.innerHTML=ids.map(id=>{const t=teams[id];
    const logo=getClanLogo(t.clan)?`<img src="${getClanLogo(t.clan)}" class="clan-logo-sm">`:'';
    return `<div class="item-row">${logo}<span class="clan-tag" style="background:${getClanColor(t.clan)};font-size:11px;">${t.clan}</span><span class="item-name">${t.name}</span><button class="item-delete" onclick="removeTeam('${id}')">✕</button></div>`;
  }).join('');
}

// Rounds
function addRound(){
  const map=document.getElementById('newRoundMap').value;
  const order=Object.keys(appData.rounds||{}).length+1;
  ref.child('rounds/'+ref.child('rounds').push().key).set({map,order});toast('R'+order+' '+map+' 추가');
}
function removeRound(id){
  const rounds=appData.rounds||{},r=rounds[id];
  const idx=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0)).indexOf(id)+1;
  showConfirm('라운드 삭제',`R${idx} ${r?.map||''} 삭제?`,()=>{
    ref.child('rounds/'+id).remove();
    Object.keys(appData.teams||{}).forEach(tid=>{ref.child('scores/'+tid+'/'+id).remove();});toast('삭제됨');
  });
}
function renderRoundList(){
  const rounds=appData.rounds||{},area=document.getElementById('roundListArea');
  const ids=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0));
  if(!ids.length){area.innerHTML='<p style="color:#64748b;font-size:13px;">등록된 라운드가 없습니다.</p>';return;}
  area.innerHTML=ids.map((id,i)=>`<div class="item-row"><span style="font-weight:800;color:#60a5fa;min-width:30px;">R${i+1}</span><span class="item-name">${rounds[id].map}</span><button class="item-delete" onclick="removeRound('${id}')">✕</button></div>`).join('');
}

// Rank Points
function renderRankPtsGrid(){
  const pts=appData.rankPts||DEFAULT_RANK_PTS,area=document.getElementById('rankPtsArea');
  let h='';for(let p=1;p<=20;p++) h+=`<div class="pts-item"><label>${p}등</label><input type="number" id="rp_${p}" min="0" max="99" value="${pts[p]||''}" placeholder="0" onfocus="this.select()"></div>`;
  area.innerHTML=h;
}
function saveRankPts(){
  const pts={};for(let p=1;p<=20;p++) pts[p]=Number(document.getElementById('rp_'+p).value)||0;
  ref.child('rankPts').set(pts);toast('점수표 저장됨');
}

// ===== Confirm / Toast =====
let confirmCb=null;
function showConfirm(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;confirmCb=cb;
  document.getElementById('confirmBtn').onclick=()=>{closeConfirm();if(confirmCb)confirmCb();};
  document.getElementById('confirmModal').classList.remove('hidden');
}
function closeConfirm(){document.getElementById('confirmModal').classList.add('hidden');confirmCb=null;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}

init();
</script>
</body>
</html>
