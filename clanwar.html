<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRIMI CLAN MATCH</title>
<link rel="icon" type="image/png" href="clanmatch-logo.png">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;font-size:15px;}
.hidden{display:none!important;}
body.guest-mode .admin-only{display:none!important;}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-blue{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;}
.btn-gray{background:#334155;color:#94a3b8;}
.btn-gray:hover{background:#475569;color:#cbd5e1;}
.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1e293b;}
.btn-sm{padding:7px 16px;font-size:13px;}
.btn-xs{padding:5px 12px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
input,select{padding:8px 12px;border:2px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:15px;outline:none;transition:border-color .2s;}
input:focus,select:focus{border-color:#3b82f6;}
.card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;transition:border-color .2s;}
.card:hover{border-color:rgba(59,130,246,.15);}

/* 로그인 */
#loginScreen{max-width:440px;margin:0 auto;text-align:center;padding:20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;}
.login-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;background:#0f172a;}
.login-bg::before{content:'';position:absolute;inset:0;background:
  linear-gradient(rgba(59,130,246,.012) 1px,transparent 1px),
  linear-gradient(90deg,rgba(59,130,246,.012) 1px,transparent 1px);
  background-size:80px 80px;}
.login-bg::after{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse at 20% 50%,rgba(59,130,246,.096) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 30%,rgba(139,92,246,.08) 0%,transparent 45%),
  radial-gradient(ellipse at 50% 90%,rgba(99,102,241,.064) 0%,transparent 40%);}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.32;animation:orbFloat 12s ease-in-out infinite;}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.05)}50%{transform:translate(-20px,30px) scale(.95)}75%{transform:translate(20px,20px) scale(1.02)}}
.scan-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.12),transparent);animation:scanDown 8s linear infinite;opacity:.4;}
@keyframes scanDown{0%{top:-2%}100%{top:102%}}
.corner{position:absolute;width:80px;height:80px;border:2px solid rgba(59,130,246,.08);}
.corner-tl{top:20px;left:20px;border-right:none;border-bottom:none;border-radius:4px 0 0 0;}
.corner-tr{top:20px;right:20px;border-left:none;border-bottom:none;border-radius:0 4px 0 0;}
.corner-bl{bottom:20px;left:20px;border-right:none;border-top:none;border-radius:0 0 0 4px;}
.corner-br{bottom:20px;right:20px;border-left:none;border-top:none;border-radius:0 0 4px 0;}
.float-icon{position:absolute;font-size:20px;opacity:.08;animation:floatIcon 20s ease-in-out infinite;}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(10deg)}}
.particle{position:absolute;width:2px;height:2px;background:#60a5fa;border-radius:50%;opacity:0;animation:particleUp linear infinite;}
.particle.spark{width:1px;height:8px;border-radius:1px;background:linear-gradient(to top,transparent,#60a5fa);animation-name:sparkUp;}
@keyframes particleUp{0%{opacity:0;transform:translateY(0) scale(1)}10%{opacity:.48}90%{opacity:.16}100%{opacity:0;transform:translateY(-100vh) scale(0)}}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) rotate(0deg)}10%{opacity:.4}90%{opacity:.08}100%{opacity:0;transform:translateY(-80vh) rotate(15deg)}}
.grid-line-h,.grid-line-v{position:absolute;opacity:0;}
.grid-line-h{height:1px;width:100%;background:linear-gradient(90deg,transparent,transparent 30%,rgba(96,165,250,.32) 50%,transparent 70%,transparent);background-size:200% 100%;animation:gridLineH linear infinite;}
.grid-line-v{width:1px;height:100%;background:linear-gradient(180deg,transparent,transparent 30%,rgba(139,92,246,.32) 50%,transparent 70%,transparent);background-size:100% 200%;animation:gridLineV linear infinite;}
@keyframes gridLineH{0%{opacity:0;background-position:200% 0}10%{opacity:1}90%{opacity:1}100%{opacity:0;background-position:-200% 0}}
@keyframes gridLineV{0%{opacity:0;background-position:0 200%}10%{opacity:1}90%{opacity:1}100%{opacity:0;background-position:0 -200%}}
.twinkle{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:twinkleAnim ease-in-out infinite;}
@keyframes twinkleAnim{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.56;transform:scale(1.3)}}
.meteor{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:meteorShoot linear infinite;}
.meteor::after{content:'';position:absolute;top:0;right:0;width:40px;height:1px;background:linear-gradient(to left,rgba(96,165,250,.48),transparent);transform:rotate(0deg);transform-origin:right center;}
@keyframes meteorShoot{0%{opacity:0;transform:translate(0,0)}5%{opacity:.64}30%{opacity:.24}35%{opacity:0;transform:translate(-300px,200px)}100%{opacity:0}}
.ring-pulse{position:absolute;border-radius:50%;border:1px solid rgba(96,165,250,.2);opacity:0;animation:ringExpand ease-out infinite;}
@keyframes ringExpand{0%{opacity:.32;transform:scale(0)}60%{opacity:.1}100%{opacity:0;transform:scale(1)}}
.login-icon{font-size:52px;margin-bottom:10px;filter:drop-shadow(0 0 24px rgba(59,130,246,.4));animation:iconPulse 3s ease-in-out infinite;}
@keyframes iconPulse{0%,100%{filter:drop-shadow(0 0 24px rgba(59,130,246,.4));transform:scale(1)}50%{filter:drop-shadow(0 0 40px rgba(139,92,246,.6));transform:scale(1.05)}}
#loginScreen h1{font-size:56px;font-weight:900;letter-spacing:8px;margin-bottom:4px;position:relative;display:inline-block;text-shadow:0 0 40px rgba(96,165,250,.2);}
#loginScreen h1 .title-main{background:linear-gradient(135deg,#60a5fa,#818cf8,#c084fc,#60a5fa);background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 4s ease infinite;-webkit-text-stroke:0.5px rgba(96,165,250,.3);}
#loginScreen h1 .title-glow{position:absolute;inset:0;background:linear-gradient(135deg,#60a5fa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:blur(16px);opacity:.6;z-index:-1;animation:gradientShift 4s ease infinite;}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#loginScreen .sub{color:#64748b;font-size:13px;margin-bottom:32px;letter-spacing:3px;text-transform:uppercase;}
#loginScreen .sub-line{display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,transparent);margin:10px auto 0;animation:lineGlow 2s ease-in-out infinite;}
@keyframes lineGlow{0%,100%{opacity:.3;width:60px}50%{opacity:.8;width:100px}}
.login-box{background:rgba(30,41,59,.8);backdrop-filter:blur(16px);border-radius:20px;padding:32px;border:1px solid rgba(96,165,250,.12);box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px rgba(59,130,246,.04);}
.login-box h2{font-size:15px;margin-bottom:18px;color:#94a3b8;font-weight:600;letter-spacing:0.5px;}
/* 커스텀 드롭다운 */
.custom-select-wrap{position:relative;margin-bottom:16px;}
.custom-select-btn{width:100%;padding:14px 18px;background:#0f172a;border:2px solid #334155;border-radius:12px;color:#e2e8f0;font-size:16px;font-weight:700;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s;}
.custom-select-btn:hover{border-color:#3b82f6;}
.custom-select-btn.open{border-color:#3b82f6;border-radius:12px 12px 0 0;}
.custom-select-btn .arrow{font-size:12px;color:#64748b;transition:transform .2s;}
.custom-select-btn.open .arrow{transform:rotate(180deg);}
.custom-select-btn .placeholder{color:#64748b;}
.custom-select-list{display:none;position:absolute;top:100%;left:0;right:0;background:#0f172a;border:2px solid #3b82f6;border-top:1px solid #334155;border-radius:0 0 12px 12px;z-index:50;max-height:220px;overflow-y:auto;}
.custom-select-list.open{display:block;}
.custom-select-item{padding:14px 18px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:background .1s;border-bottom:1px solid #1e293b;}
.custom-select-item:last-child{border-bottom:none;}
.custom-select-item:hover{background:#1e293b;}
.custom-select-item.selected{background:rgba(59,130,246,.15);color:#60a5fa;}
.custom-select-item .cs-dot{width:8px;height:8px;border-radius:50%;background:#3b82f6;}
.pin-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.pin-digit{width:52px;height:60px;text-align:center;font-size:26px;font-weight:800;border:2px solid #334155;border-radius:12px;background:rgba(15,23,42,.8);color:#fbbf24;outline:none;transition:all .2s;}
.pin-digit:focus{border-color:#60a5fa;box-shadow:0 0 12px rgba(96,165,250,.15);}
.pin-error{color:#ef4444;font-size:13px;margin-bottom:8px;min-height:18px;}
.login-divider{border-top:1px solid rgba(51,65,85,.6);margin:24px 0;position:relative;}
.login-divider span{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:rgba(30,41,59,.85);padding:0 14px;color:#475569;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
.pin-section{display:none;}
.pin-section.show{display:block;}

/* 앱 배경 */
#appScreen{position:relative;}
#appScreen::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:
  radial-gradient(ellipse at 15% 10%,rgba(59,130,246,.10) 0%,transparent 50%),
  radial-gradient(ellipse at 85% 90%,rgba(139,92,246,.08) 0%,transparent 50%),
  radial-gradient(ellipse at 50% 50%,rgba(99,102,241,.05) 0%,transparent 60%);
  pointer-events:none;z-index:0;}
#appScreen::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(rgba(59,130,246,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.02) 1px,transparent 1px);
  background-size:120px 120px;pointer-events:none;z-index:0;}
.app-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:appOrbFloat 20s ease-in-out infinite;}
@keyframes appOrbFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,-30px)}66%{transform:translate(-30px,40px)}}
.app-scan{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.08),transparent);animation:scanDown 12s linear infinite;pointer-events:none;z-index:0;}
#appScreen>*{position:relative;z-index:1;}

/* 상단바 */
.top-bar{position:relative;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  background:linear-gradient(135deg,rgba(15,23,42,.95),rgba(30,41,59,.9));
  border-bottom:1px solid rgba(59,130,246,.15);
  box-shadow:0 4px 20px rgba(0,0,0,.3),0 1px 0 rgba(59,130,246,.08) inset;}
.top-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.3),rgba(139,92,246,.2),transparent);}
.top-bar h1{font-size:26px;font-weight:900;letter-spacing:5px;cursor:pointer;position:relative;-webkit-text-stroke:1.5px rgba(96,165,250,.4);
  background:linear-gradient(135deg,#60a5fa,#818cf8,#60a5fa);background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 4s ease infinite;text-shadow:0 0 20px rgba(96,165,250,.15);}
.top-bar h1::before{content:'🛡️';margin-right:8px;font-size:22px;-webkit-text-fill-color:initial;filter:drop-shadow(0 0 8px rgba(59,130,246,.4));vertical-align:middle;}
.top-info{display:flex;align-items:center;gap:10px;font-size:14px;color:#94a3b8;}
.badge-admin{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;box-shadow:0 0 10px rgba(239,68,68,.2);}
.badge-guest{background:#334155;color:#94a3b8;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;}
.online-dot{display:inline-block;width:7px;height:7px;background:#10b981;border-radius:50%;margin-right:3px;box-shadow:0 0 6px rgba(16,185,129,.4);}
.online-info{font-size:12px;color:#94a3b8;}
.tabs{display:flex;background:rgba(30,41,59,.8);border-bottom:1px solid #334155;overflow-x:auto;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);}
.tab{padding:14px 20px;font-size:15px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab:hover{color:#94a3b8;background:rgba(59,130,246,.03);}
.tab.active{color:#60a5fa;border-bottom-color:#3b82f6;background:rgba(59,130,246,.05);}
.main{padding:20px;max-width:1400px;margin:0 auto;}

/* TOP 3 포디움 */
.podium{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.podium-card{background:#1e293b;border-radius:14px;padding:14px 20px;border:2px solid #334155;text-align:center;min-width:140px;flex:0 1 200px;transition:all .2s;}
.podium-card.p1{border-color:#fbbf24;box-shadow:0 0 24px rgba(251,191,36,.15),0 0 48px rgba(251,191,36,.05);order:2;}
.podium-card.p2{border-color:#c0c0c0;order:1;}
.podium-card.p3{border-color:#cd7f32;order:3;}
.podium-medal{font-size:28px;margin-bottom:2px;}
.podium-rank{font-size:12px;font-weight:800;color:#64748b;margin-bottom:4px;}
.podium-team{font-size:16px;font-weight:900;margin-bottom:2px;}
.podium-score{font-size:22px;font-weight:900;color:#fbbf24;}
.podium-clan{margin-top:4px;}

/* 순위 보드 */
.board-section{margin-bottom:24px;}
.board-title{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.board-title .live-dot{width:8px;height:8px;background:#10b981;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.score-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #334155;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.score-table{width:100%;border-collapse:collapse;font-size:15px;min-width:600px;}
.score-table th{background:#334155;padding:12px 10px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;white-space:nowrap;position:sticky;top:0;z-index:1;}
.score-table td{padding:12px 10px;text-align:center;border-bottom:1px solid #0f172a;white-space:nowrap;font-size:15px;}
.score-table tbody tr:hover td{background:rgba(51,65,85,.4);}
.score-table .col-rank{font-size:22px;font-weight:900;width:46px;}
.score-table .col-team{text-align:left;font-weight:700;font-size:16px;}
.score-table .col-kill{color:#fbbf24;font-weight:700;}
.score-table .col-place{color:#60a5fa;font-weight:600;}
.score-table .col-total{font-weight:900;font-size:18px;color:#fbbf24;}
.score-table .row-gold td{background:rgba(251,191,36,.14);}
.score-table .row-silver td{background:rgba(192,192,192,.10);}
.score-table .row-bronze td{background:rgba(205,127,50,.10);}
.rank-1{color:#fbbf24;}.rank-2{color:#c0c0c0;}.rank-3{color:#cd7f32;}.rank-else{color:#475569;}
.clan-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;color:#fff;}
.round-header{font-size:11px;color:#64748b;display:block;font-weight:400;}
.placement-num{font-size:11px;color:#94a3b8;display:block;margin-top:1px;}

/* 라운드별 순위 */
.round-rank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:20px;}
.round-rank-card{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow:visible;min-width:0;}
.round-rank-head{padding:12px 16px;background:#334155;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;}
.round-rank-head .rr-round{color:#60a5fa;}
.round-rank-head .rr-map{color:#94a3b8;font-weight:600;font-size:13px;}
.rr-table{width:100%;border-collapse:collapse;font-size:14px;}
.rr-table td{padding:8px 12px;border-bottom:1px solid #0f172a;}
.rr-table .rr-rank{font-weight:900;width:32px;text-align:center;font-size:16px;}
.rr-table .rr-team{font-weight:700;text-align:left;word-break:break-all;}
.rr-table .rr-kill{color:#fbbf24;font-weight:700;text-align:center;width:50px;}
.rr-table .rr-pts{color:#60a5fa;font-weight:700;text-align:center;width:50px;}
.rr-table .rr-total{font-weight:900;color:#fbbf24;text-align:center;width:55px;font-size:15px;}
.rr-table tr:first-child td{background:rgba(251,191,36,.14);}
.rr-table tr:nth-child(2) td{background:rgba(192,192,192,.10);}
.rr-table tr:nth-child(3) td{background:rgba(205,127,50,.10);}

/* 점수 입력 */
.round-tabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap;}
.round-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:#0f172a;color:#64748b;border:1px solid #334155;transition:all .15s;}
.round-tab:hover{border-color:#60a5fa;color:#94a3b8;}
.round-tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6;}
.input-table{width:100%;border-collapse:collapse;font-size:15px;}
.input-table th{background:#334155;padding:12px;text-align:center;font-weight:700;font-size:13px;color:#94a3b8;}
.input-table td{padding:10px;text-align:center;border-bottom:1px solid #0f172a;}
.input-table .team-name-cell{text-align:left;font-weight:700;font-size:15px;}
.input-table select,.input-table input[type=number]{width:70px;padding:7px 4px;font-size:15px;text-align:center;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;}
.input-table input[type=number]:focus,.input-table select:focus{border-color:#3b82f6;outline:none;}
.auto-pts{font-size:14px;color:#60a5fa;font-weight:700;}

/* 설정 */
.setup-card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;margin-bottom:16px;}
.setup-card h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.setup-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.setup-row label{font-size:14px;color:#94a3b8;min-width:60px;}
.item-list{display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0f172a;border-radius:8px;border:1px solid #334155;}
.item-row .item-name{flex:1;font-weight:600;font-size:14px;}
.item-delete{background:none;border:none;color:#475569;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;}
.item-delete:hover{background:#ef4444;color:#fff;}
.color-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.clan-logo{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #475569;}
.clan-logo-sm{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid #475569;}
.clan-avatar{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-size:15px;font-weight:800;vertical-align:middle;margin-right:6px;flex-shrink:0;}
.clan-logo-lg{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #475569;margin-bottom:6px;}
.logo-upload-btn{padding:6px 12px;background:#334155;border:1px dashed #475569;border-radius:8px;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-block;}
.logo-upload-btn:hover{background:#475569;color:#e2e8f0;border-color:#60a5fa;}
.logo-preview{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #475569;}
.pts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;}
.pts-item{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0f172a;border-radius:6px;border:1px solid #334155;font-size:13px;}
.pts-item label{color:#94a3b8;white-space:nowrap;min-width:30px;}
.pts-item input{width:44px;padding:4px;font-size:13px;text-align:center;border:1px solid #334155;border-radius:4px;background:#1e293b;color:#fbbf24;font-weight:700;}

/* 캡처 */
.capture-btn{background:#334155;border:1px solid #475569;color:#94a3b8;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.capture-btn:hover{background:#475569;color:#e2e8f0;border-color:#60a5fa;}
.capture-btn svg{width:14px;height:14px;}
.capture-wrap{padding:16px;background:#0f172a;border-radius:12px;}

/* 히스토리 */
.history-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;cursor:pointer;transition:all .15s;}
.history-item:hover{border-color:#3b82f6;background:#1e293b;}
.history-item .hi-title{font-weight:700;font-size:15px;}
.history-item .hi-date{font-size:13px;color:#64748b;}
.history-item .hi-teams{font-size:12px;color:#94a3b8;}

/* 토스트 */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* 모달 */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:#1e293b;border-radius:16px;padding:28px;border:1px solid #334155;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;color:#64748b;font-size:22px;cursor:pointer;padding:4px;}
.modal-close:hover{color:#e2e8f0;}

@media(max-width:600px){
  .top-bar{padding:10px 14px;}
  .main{padding:14px;}
  .podium{gap:8px;}
  .podium-card{min-width:100px;padding:10px 12px;}
  .podium-team{font-size:14px;}
  .podium-score{font-size:18px;}
  .score-table{min-width:500px;}
  .pts-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}
  .round-rank-grid{grid-template-columns:1fr;}
}
</style>
</head>

<!-- 로그인 -->

  <div class="top-bar">

      <div id="podiumArea" class="podium"></div>
      <div class="board-section">
        <div class="board-title" style="justify-content:space-between;">
          <span style="display:flex;align-items:center;gap:8px;"><span class="live-dot"></span> 실시간 팀 순위</span>
          <button class="capture-btn" onclick="captureElement('captureTotal','전체순위')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>전체 캡처</button>

        <div class="setup-row"><label>대회명</label><input type="text" id="eventTitle" placeholder="예: 제1회 클랜 교류전" style="flex:1;max-width:300px;" onchange="saveConfig()"></div>

        <div class="setup-row" style="margin-top:12px;">
          <label>공용 PIN</label>

          <button class="btn btn-xs btn-gray" onclick="togglePinVisible()">보기</button>
          <input type="password" id="newPinInput" placeholder="새 PIN (4자리)" maxlength="4" style="width:100px;font-size:14px;">
          <button class="btn btn-sm btn-gray" onclick="changePin()">PIN 변경</button>

          <label class="logo-upload-btn" id="logoUploadLabel"><span id="logoUploadText">마크 업로드</span><input type="file" id="newClanLogo" accept="image/*" style="display:none;" onchange="previewLogo(this)"></label>
          <img id="logoPreview" class="logo-preview" style="display:none;">
          <button class="btn btn-sm btn-blue" onclick="addClan()">추가</button>

<div class="toast" id="toast"></div>

  <div class="modal-box">
    <div class="modal-title"><span id="confirmTitle">확인</span><button class="modal-close" onclick="closeConfirm()">✕</button></div>
    <p id="confirmMsg" style="margin-bottom:18px;color:#94a3b8;font-size:15px;"></p>

      <button class="btn btn-sm btn-gray" onclick="closeConfirm()">취소</button>

<script>
firebase.initializeApp({apiKey:"AIzaSyABoG4B0ahW0OAZURa3WZAz9HDST49A2K4",authDomain:"grimi-pubg.firebaseapp.com",databaseURL:"https://grimi-pubg-default-rtdb.firebaseio.com",projectId:"grimi-pubg",storageBucket:"grimi-pubg.firebasestorage.app",messagingSenderId:"507556279092",appId:"1:507556279092:web:71182597db9c8c8a71ab61"});
const db=firebase.database(),ROOT='clanwar',ref=db.ref(ROOT);

let isAdmin=false,currentAdminName='',appData={},presenceKey=null;
const DEFAULT_RANK_PTS={1:10,2:6,3:5,4:4,5:3,6:2,7:1,8:0,9:0,10:0,11:0,12:0,13:0,14:0,15:0,16:0,17:0,18:0,19:0,20:0};
let activeInputRound=null,selectedAdminId=null;

function init(){
  ref.on('value',snap=>{
    appData=snap.val()||{};
    ['config','admins','clans','teams','rounds','scores','history'].forEach(k=>{if(!appData[k])appData[k]={};});
    if(!appData.rankPts) appData.rankPts=DEFAULT_RANK_PTS;
    if(!appData.presence) appData.presence={};
    renderLoginAdmins();
    if(!document.getElementById('appScreen').classList.contains('hidden')) renderAll();
  });
  ref.child('presence').on('value',snap=>{appData.presence=snap.val()||{};updateOnlineDisplay();});
  // Close dropdown on outside click
  document.addEventListener('click',e=>{
    if(!e.target.closest('#adminSelectWrap')){
      document.getElementById('adminSelectBtn').classList.remove('open');
      document.getElementById('adminSelectList').classList.remove('open');
    }
  });
}

// ===== Presence =====
function joinPresence(name,role){
  const pRef=ref.child('presence').push();
  presenceKey=pRef.key;
  pRef.set({name,role,joinedAt:Date.now()});
  pRef.onDisconnect().remove();
}
function leavePresence(){if(presenceKey){ref.child('presence/'+presenceKey).remove();presenceKey=null;}}
function updateOnlineDisplay(){
  const entries=Object.values(appData.presence||{});
  const el=document.getElementById('onlineCount');
  if(el) el.textContent=entries.length;
  const listArea=document.getElementById('onlineListArea');
  if(!listArea) return;
  if(!entries.length){listArea.innerHTML='';return;}
  const admins=entries.filter(e=>e.role==='admin');
  const guests=entries.filter(e=>e.role==='guest');
  let html='<div style="font-size:13px;color:#64748b;display:flex;flex-wrap:wrap;gap:6px;align-items:center;"><span style="font-weight:700;">접속 중:</span> ';
  admins.forEach(a=>{html+=`<span style="background:#ef4444;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;">${a.name}</span>`;});
  if(guests.length) html+=`<span style="background:#334155;padding:2px 8px;border-radius:6px;font-size:12px;">게스트 ${guests.length}명</span>`;
  html+='</div>';
  listArea.innerHTML=html;
}

// ===== Login (Custom Dropdown) =====
function renderLoginAdmins(){
  const admins=appData.admins||{};
  const ids=Object.keys(admins);
  const list=document.getElementById('adminSelectList');
  if(!ids.length){
    list.innerHTML='<div class="custom-select-item" onclick="pickAdmin(\'__master__\',\'최초 설정\')"><span class="cs-dot"></span> 최초 설정 (관리자 등록)</div>';
    return;
  }
  list.innerHTML=ids.map(id=>{
    const a=admins[id];
    return `<div class="custom-select-item" onclick="pickAdmin('${id}','${a.name}')">${a.name}</div>`;
  }).join('');
}
function toggleAdminDropdown(){
  document.getElementById('adminSelectBtn').classList.toggle('open');
  document.getElementById('adminSelectList').classList.toggle('open');
}
function pickAdmin(id,name){
  selectedAdminId=id;
  const btn=document.getElementById('adminSelectBtn');
  btn.innerHTML=`<span style="color:#e2e8f0;font-weight:700;">${name}</span><span class="arrow">▼</span>`;
  btn.classList.remove('open');
  document.getElementById('adminSelectList').classList.remove('open');
  document.getElementById('selectedAdminName').textContent=name;
  document.getElementById('pinSection').classList.add('show');
  setupPinInputs();
}
function setupPinInputs(){
  const inps=document.querySelectorAll('#pinInputs .pin-digit');
  inps.forEach((inp,i)=>{
    inp.value='';
    const n=inp.cloneNode(true);
    inp.parentNode.replaceChild(n,inp);
  });
  const f=document.querySelectorAll('#pinInputs .pin-digit');
  f.forEach((inp,i)=>{
    inp.addEventListener('input',()=>{
      if(inp.value.length===1&&i<f.length-1) f[i+1].focus();
      if(i===f.length-1&&inp.value) setTimeout(tryLogin,80);
    });
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0){f[i-1].focus();f[i-1].value='';}});
  });
  setTimeout(()=>f[0]?.focus(),100);
}
function getPinValue(){return Array.from(document.querySelectorAll('#pinInputs .pin-digit')).map(i=>i.value).join('');}
function tryLogin(){
  const pin=getPinValue();if(pin.length<4) return;
  if(pin===(appData.config?.adminPin||'0000')){
    isAdmin=true;
    currentAdminName=selectedAdminId==='__master__'?'마스터':(appData.admins?.[selectedAdminId]?.name||'관리자');
    enterApp();
  } else {
    document.getElementById('pinError').textContent='PIN이 올바르지 않습니다';
    document.querySelectorAll('#pinInputs .pin-digit').forEach(i=>i.value='');
    document.querySelector('#pinInputs .pin-digit')?.focus();
  }
}
function enterAsGuest(){isAdmin=false;currentAdminName='';enterApp();}
function enterApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('loginBg').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('appBgEffects').classList.remove('hidden');
  if(!isAdmin) document.body.classList.add('guest-mode');
  else document.body.classList.remove('guest-mode');
  document.getElementById('roleBadge').innerHTML=isAdmin?`<span class="badge-admin">${currentAdminName}</span>`:'<span class="badge-guest">조회 모드</span>';
  joinPresence(isAdmin?currentAdminName:'게스트',isAdmin?'admin':'guest');
  renderAll();
}
function logout(){
  leavePresence();
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginBg').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('appBgEffects').classList.add('hidden');
  document.body.classList.remove('guest-mode');
  isAdmin=false;currentAdminName='';selectedAdminId=null;
  document.getElementById('pinSection').classList.remove('show');
  document.getElementById('pinError').textContent='';
  // Reset dropdown
  document.getElementById('adminSelectBtn').innerHTML='<span class="placeholder">관리자를 선택하세요</span><span class="arrow">▼</span>';
  renderLoginAdmins();
  switchTab('board');
}

// ===== Tabs =====
function switchTab(t){
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
  ['board','history','input','setup'].forEach(id=>{const el=document.getElementById('tab-'+id);if(el) el.classList.toggle('hidden',id!==t);});
  if(t==='input') renderScoreInput();
  if(t==='history') renderHistory();
}

// ===== Render All =====
function renderAll(){
  document.getElementById('titleDisplay').textContent=appData.config?.title||'';
  renderPodium();
  renderTeamBoard();
  renderRoundRanks();
  updateOnlineDisplay();
  if(isAdmin){renderSetup();renderScoreInput();}
}

// ===== Helpers =====
function getRankPts(p){return Number((appData.rankPts||DEFAULT_RANK_PTS)[p])||0;}
function getClanColor(id){return appData.clans?.[id]?.color||'#64748b';}
function getClanName(id){return appData.clans?.[id]?.name||id;}
function getClanLogo(id){return appData.clans?.[id]?.logo||'';}
function clanTagHtml(id){
  const logo=getClanLogo(id);
  const color=getClanColor(id);
  const tag=`<span class="clan-tag" style="background:${color};margin-right:6px;">${id}</span>`;
  if(logo) return `<img src="${logo}" class="clan-logo-sm" alt="${id}">${tag}`;
  return `<span class="clan-avatar" style="background:${color};">${id.charAt(0)}</span>${tag}`;
}
let pendingLogoBase64='';
function previewLogo(input){
  const file=input.files[0];
  if(!file){pendingLogoBase64='';document.getElementById('logoPreview').style.display='none';document.getElementById('logoUploadText').textContent='마크 업로드';return;}
  resizeImage(file,128,function(b64){pendingLogoBase64=b64;const p=document.getElementById('logoPreview');p.src=b64;p.style.display='block';document.getElementById('logoUploadText').textContent='변경';});
}
function resizeImage(file,maxSize,cb){
  const r=new FileReader();
  r.onload=function(e){const img=new Image();img.onload=function(){const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>h){if(w>maxSize){h=h*(maxSize/w);w=maxSize;}}else{if(h>maxSize){w=w*(maxSize/h);h=maxSize;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/webp',0.8));};img.src=e.target.result;};
  r.readAsDataURL(file);
}

function getTeamScores(){
  const teams=appData.teams||{},rounds=appData.rounds||{},scores=appData.scores||{};
  const roundIds=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0));
  const result=[];
  Object.keys(teams).forEach(tid=>{
    const t=teams[tid];let totalKills=0,totalPlacePts=0;const roundData={};
    roundIds.forEach(rid=>{
      const s=scores[tid]?.[rid];
      const kills=s?Number(s.kills)||0:0;
      const placement=s?Number(s.placement)||0:0;
      const placePts=placement>0?getRankPts(placement):0;
      roundData[rid]={kills,placement,placePts};
      totalKills+=kills;totalPlacePts+=placePts;
    });
    result.push({id:tid,name:t.name,clan:t.clan,roundData,totalKills,totalPlacePts,total:totalKills+totalPlacePts});
  });
  result.sort((a,b)=>b.total-a.total||(b.totalKills-a.totalKills));
  return {scores:result,roundIds};
}

function renderRoundRanks(){
  const {scores,roundIds}=getTeamScores();
  const rounds=appData.rounds||{};

  if(!roundIds.length||!scores.length){area.innerHTML='';return;}
  let cards='';
  roundIds.forEach((rid,i)=>{
    const r=rounds[rid];
    const ranked=scores.map(s=>{
      const rd=s.roundData[rid];
      const kills=rd?rd.kills:0;
      const placePts=rd?rd.placePts:0;
      const roundTotal=kills+placePts;
      return {name:s.name,clan:s.clan,kills,placePts,roundTotal};
    }).sort((a,b)=>b.roundTotal-a.roundTotal||(b.kills-a.kills));

function addTeam(){
  const clan=document.getElementById('newTeamClan').value;
  if(!clan){toast('클랜을 선택하세요');return;}
  const slotInput=document.getElementById('newTeamSlot');
  const slotVal=slotInput.value.trim();
  const teams=appData.teams||{};
  let name;
  if(slotVal){
    name=clan+'-'+slotVal;
    // 중복 체크
    const dup=Object.values(teams).find(t=>t.name===name);
    if(dup){toast(name+' 이미 존재합니다');return;}
  } else {
    let maxNum=0;
    Object.values(teams).forEach(t=>{
      if(t.clan===clan){
        const m=t.name.match(new RegExp('^'+clan+'-(\\d+)$'));
        if(m) maxNum=Math.max(maxNum,Number(m[1]));
      }
    });
    name=clan+'-'+(maxNum+1);
  }
  ref.child('teams/'+ref.child('teams').push().key).set({name,clan});
  slotInput.value='';
  toast(name+' 팀 추가');
}

    };
    const hKey=ref.child('history').push().key;
    ref.child('history/'+hKey).set(archive).then(()=>{
      // Also capture image
      captureElement('captureTotal',title.replace(/\s/g,'_'));
      // Reset scores and rounds
      ref.child('scores').remove();
      ref.child('rounds').remove();
      ref.child('teams').remove();
      toast('기록 저장 완료!');
    });
  });
}
function renderHistory(){
  const history=appData.history||{};
  const area=document.getElementById('historyArea');
  const ids=Object.keys(history).sort((a,b)=>{
    const da=history[a].date||'',db=history[b].date||'';
    return db.localeCompare(da);
  });
  if(!ids.length){area.innerHTML='<div class="card" style="text-align:center;color:#64748b;padding:40px;">저장된 대회 기록이 없습니다.</div>';return;}
  let items='';
  ids.forEach(id=>{
    const h=history[id];
    const d=h.date?new Date(h.date):null;
    const dateStr=d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'';
    const teamCount=Object.keys(h.teams||{}).length;
    const clanCount=Object.keys(h.clans||{}).length;
    const delBtn=isAdmin?`<button class="item-delete" onclick="event.stopPropagation();deleteHistory('${id}')" style="margin-left:8px;">✕</button>`:'';
    items+=`<div class="history-item" onclick="viewHistory('${id}')"><div><div class="hi-title">${h.title||'무제'}</div><div class="hi-date">${dateStr}</div></div><div style="display:flex;align-items:center;"><div style="text-align:right;"><div class="hi-teams">${clanCount}클랜 ${teamCount}팀</div><span style="color:#3b82f6;font-size:13px;font-weight:600;">조회 →</span></div>${delBtn}</div></div>`;
  });
  area.innerHTML=`<h3 style="font-size:18px;font-weight:800;margin-bottom:14px;">대회 기록</h3><div class="history-list">${items}</div>`;
}
function deleteHistory(hid){
  const h=appData.history?.[hid];
  showConfirm('기록 삭제',`"${h?.title||'무제'}" 대회 기록을 삭제합니다.`,()=>{ref.child('history/'+hid).remove();toast('기록 삭제됨');renderHistory();});
}
function viewHistory(hid){
  const h=appData.history?.[hid];
  if(!h) return;
  // Build a temporary modal showing the archived results
  const teams=h.teams||{},rounds=h.rounds||{},scores=h.scores||{},rankPts=h.rankPts||DEFAULT_RANK_PTS;
  const roundIds=Object.keys(rounds).sort((a,b)=>(rounds[a].order||0)-(rounds[b].order||0));
  const getRp=p=>Number((rankPts)[p])||0;
  const result=[];
  Object.keys(teams).forEach(tid=>{
    const t=teams[tid];let totalKills=0,totalPlacePts=0;
    roundIds.forEach(rid=>{
      const s=scores[tid]?.[rid];
      const kills=s?Number(s.kills)||0:0;
      const placement=s?Number(s.placement)||0:0;
      const placePts=placement>0?getRp(placement):0;
      totalKills+=kills;totalPlacePts+=placePts;
    });
    result.push({name:t.name,clan:t.clan,totalKills,totalPlacePts,total:totalKills+totalPlacePts});
  });
  result.sort((a,b)=>b.total-a.total||(b.totalKills-a.totalKills));
  const clans=h.clans||{};
  const clanTag=(cid)=>{
    const c=clans[cid];
    const logo=c?.logo?`<img src="${c.logo}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:3px;border:1px solid #475569;">`:'';
    return `${logo}<span class="clan-tag" style="background:${c?.color||'#64748b'};margin-right:6px;">${cid}</span>`;
  };
  const d=h.date?new Date(h.date):null;
  const dateStr=d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'';
  let rows='';
  result.forEach((s,i)=>{
    const rank=i+1;
    const rc=rank<=3?'rank-'+rank:'rank-else';
    const rowc=rank===1?'row-gold':rank===2?'row-silver':rank===3?'row-bronze':'';
    rows+=`<tr class="${rowc}"><td class="col-rank ${rc}">${rank}</td><td class="col-team">${clanTag(s.clan)}${s.name}</td><td class="col-kill">${s.totalKills}</td><td class="col-place">${s.totalPlacePts}</td><td class="col-total">${s.total}</td></tr>`;
  });
  const modal=document.getElementById('confirmModal');
  document.getElementById('confirmTitle').innerHTML=`${h.title||'무제'} <span style="font-size:13px;color:#64748b;font-weight:400;">${dateStr}</span>`;
  document.getElementById('confirmMsg').innerHTML=`<div id="captureHistory_${hid}" style="overflow-x:auto;"><table class="score-table" style="min-width:400px;"><thead><tr><th>#</th><th style="text-align:left;">팀</th><th>총킬</th><th>순위점</th><th>합계</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.getElementById('confirmBtn').textContent='캡처';
  document.getElementById('confirmBtn').className='btn btn-sm btn-blue';
  document.getElementById('confirmBtn').onclick=()=>{captureElement('captureHistory_'+hid,h.title||'history');};
  modal.classList.remove('hidden');
}

// ===== Capture =====
function captureElement(elId,filename){
  const el=document.getElementById(elId);
  if(!el){toast('캡처 대상 없음');return;}
  toast('캡처 중...');
  // Wrap in a temporary container for better background
  const wrap=document.createElement('div');
  wrap.style.cssText='padding:20px;background:#0f172a;border-radius:12px;display:inline-block;min-width:'+el.offsetWidth+'px;';
  // Add title header
  const title=appData.config?.title||'CLAN MATCH';
  const header=document.createElement('div');
  header.style.cssText='text-align:center;margin-bottom:12px;font-family:-apple-system,Pretendard,sans-serif;';
  header.innerHTML=`<div style="font-size:20px;font-weight:900;color:#60a5fa;letter-spacing:1px;">GRIMI CLAN MATCH</div><div style="font-size:14px;color:#94a3b8;margin-top:2px;">${title}</div>`;
  wrap.appendChild(header);
  const clone=el.cloneNode(true);
  // Remove capture buttons from clone
  clone.querySelectorAll('.capture-btn').forEach(b=>b.remove());
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  html2canvas(wrap,{backgroundColor:'#0f172a',scale:2,useCORS:true}).then(canvas=>{
    document.body.removeChild(wrap);
    const link=document.createElement('a');
    link.download=`clanwar_${filename}_${new Date().toISOString().slice(0,10)}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('캡처 완료!');
  }).catch(err=>{
    document.body.removeChild(wrap);
    console.error(err);toast('캡처 실패');
  });
}

// ===== Confirm / Toast =====
let confirmCb=null;
function showConfirm(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;confirmCb=cb;
  document.getElementById('confirmBtn').onclick=()=>{const cb=confirmCb;closeConfirm();if(cb)cb();};
  document.getElementById('confirmModal').classList.remove('hidden');
}
function closeConfirm(){document.getElementById('confirmModal').classList.add('hidden');confirmCb=null;const btn=document.getElementById('confirmBtn');btn.textContent='확인';btn.className='btn btn-sm btn-red';}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}
